name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        run: gradle assembleDebug --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Bants.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Bants-apk
          path: Bants.apk

      # Every build on main becomes a release, so the newest APK is always at
      # https://github.com/wellsey001/bants-android/releases/latest/download/Bants.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.0.${{ github.run_number }}"
          NOTES=$(git log -1 --pretty=format:'%s%n%n%b' | sed '/^Co-Authored-By/d;/^Claude-Session/d')
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            # Re-run of the same build: just replace the APK
            gh release upload "v$VERSION" Bants.apk --clobber
          else
            gh release create "v$VERSION" Bants.apk \
              --title "Bants $VERSION" \
              --notes "$NOTES" \
              --latest
          fi

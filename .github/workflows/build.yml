name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unpack the signing key
        env:
          KEYSTORE_B64: ${{ secrets.BANTS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Add the BANTS_KEYSTORE_BASE64, BANTS_KEYSTORE_PASSWORD, BANTS_KEY_ALIAS and BANTS_KEY_PASSWORD secrets first"
            exit 1
          fi
          echo "$KEYSTORE_B64" | tr -d " \r\n" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "BANTS_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Check the signing key
        env:
          PW: ${{ secrets.BANTS_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.BANTS_KEY_ALIAS }}
        run: |
          echo "password length: ${#PW}, alias length: ${#ALIAS}"
          keytool -list -v -keystore "$BANTS_KEYSTORE_FILE" -storetype PKCS12 -storepass "$(echo -n "$PW" | tr -d ' \r\n')" | grep -E "Alias name|SHA256:|Owner" || echo "could not open the key store"

      - name: Build
        env:
          BANTS_KEYSTORE_PASSWORD: ${{ secrets.BANTS_KEYSTORE_PASSWORD }}
          BANTS_KEY_ALIAS: ${{ secrets.BANTS_KEY_ALIAS }}
          BANTS_KEY_PASSWORD: ${{ secrets.BANTS_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Bants.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Bants-apk
          path: Bants.apk

      # Every build on main becomes a release, so the newest APK is always at
      # https://github.com/wellsey001/bants-android/releases/latest/download/Bants.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.0.${{ github.run_number }}"
          NOTES=$(git log -1 --pretty=format:'%s%n%n%b' | sed '/^Co-Authored-By/d;/^Claude-Session/d')
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            # Re-run of the same build: just replace the APK
            gh release upload "v$VERSION" Bants.apk --clobber
          else
            gh release create "v$VERSION" Bants.apk \
              --title "Bants $VERSION" \
              --notes "$NOTES" \
              --latest
          fi
